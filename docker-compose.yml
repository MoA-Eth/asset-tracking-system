# Asset Tracking System: database, Node.js API and nginx (web app + HTTPS).
#
#   cp .env.example .env              # then fill in the passwords
#   # put the certificate in ./ssl/fullchain.pem and ./ssl/privkey.pem
#   docker compose up -d --build
#
# See docs/DEPLOYMENT.md.

# Docker keeps container logs forever by default; cap them so they can't fill the disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  # ── PostgreSQL database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: moa_ams
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: moa_ams
      TZ: ${TZ:-Africa/Addis_Ababa}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moa_ams -d moa_ams"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Reachable only by the backend, not from outside the server

  # ── Node.js API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Shown by /api/health; Jenkins passes the commit being deployed
        APP_COMMIT: ${APP_COMMIT:-dev}
    image: moa-ams-backend:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://moa_ams:${POSTGRES_PASSWORD}@db:5432/moa_ams?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # nginx is the one proxy in front, so sign-in limits see the real client address
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # "Today's date" on slips and in the audit log comes from this clock
      TZ: ${TZ:-Africa/Addis_Ababa}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Deployment environment tier: dev | qa | stage | prod
      APP_ENV: ${APP_ENV:-prod}
      # Used once, to create the first System Administrator; ignored when one already exists
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      ADMIN_EMPLOYEE_ID: ${ADMIN_EMPLOYEE_ID:-}
    expose:
      - "3000"
    volumes:
      - slip-files:/app/backend/uploads

  # ── Nginx: serves the web app (PWA) and forwards /api/ to the backend ─────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: moa-ams-nginx:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro

volumes:
  # The database, and the scanned slips. Back up both.
  db-data:
  slip-files:
