# Run the full Docker stack on your own computer, over plain HTTP, without a certificate:
#
#   npm run docker:local          # then open http://localhost:8080
#   npm run docker:local:down     # stop (keeps the local database)
#
# This file only adds to docker-compose.yml. Jenkins copies docker-compose.yml alone to
# staging and production, so nothing here reaches the servers.

services:
  backend:
    environment:
      APP_ENV: dev

  nginx:
    # Port 8080 by default, so it doesn't clash with anything already on 80/443; LOCAL_PORT in .env changes it
    ports: !override
      - "${LOCAL_PORT:-8080}:80"
    # The HTTP-only configuration instead of the HTTPS one built into the image, and no ./ssl folder
    volumes: !override
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
