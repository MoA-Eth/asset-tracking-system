# Run the full Docker stack on your own computer, over plain HTTP, without a certificate.
# Usage: docker compose -f docker-compose.local.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-moa_ats}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moa_ats}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: development
      APP_ENV: dev
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moa_ats}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      TRUST_PROXY: 1
      CORS_ORIGIN: ${CORS_ORIGIN}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMPLOYEE_ID: ${ADMIN_EMPLOYEE_ID}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  nginx:
    build:
      # The context must be the root folder (.) so it can copy the frontend and nginx folders
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    ports:
      - "${LOCAL_PORT:-8080}:80"
    volumes:
      # Override the config inside the container to use the local HTTP-only config
      - ./nginx/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata: