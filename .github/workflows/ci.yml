name: CI Pipeline

on:
  push:
    branches:
      - main
      - stage
      - qa
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - main
      - stage
      - qa
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/moa_ams?schema=public'

      - name: Run backend tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: 'ci-testing-secret-random-32-characters-minimum-key'

      - name: Compile TypeScript backend
        run: npm run build

  frontend-checks:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend production bundle
        run: npm run build

  docker-build:
    name: Docker Image Build Validation
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build unified Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: moa-asset-tracking:ci
