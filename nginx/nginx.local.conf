# Local Docker run only (docker-compose.local.yml mounts this over the image's nginx.conf).
# The same app as nginx.conf, over plain HTTP: no certificate needed, and no HSTS, which would
# make the browser insist on HTTPS for localhost afterwards. Production and staging never use this file.
server {
    listen 80 default_server;
    server_name _;

    # Scanned slips are at most 10 MB (backend/src/lib/uploads.ts), plus room for the request
    client_max_body_size 15M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Node.js API, including the scanned slips
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React SPA (PWA) - everything else
    root  /usr/share/nginx/html;
    index index.html;

    # No $uri/ here: /assets is also the name of the folder of built files, and a directory match
    # would redirect a refresh on the Assets page to that folder instead of the app
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /index.html {
        expires -1;
    }
    location = /sw.js {
        expires -1;
    }
    location = /manifest.json {
        expires -1;
    }
}
