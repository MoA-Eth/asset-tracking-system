# HTTP to HTTPS redirect
server {
    listen 80;
    server_name ams.moa.gov.et;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name ams.moa.gov.et;

    # SSL certificates (mounted from ./ssl on the server, see docs/DEPLOYMENT.md)
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers. Nested locations below don't use add_header, so they all keep these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Scanned slips are at most 10 MB (backend/src/lib/uploads.ts), plus room for the request
    client_max_body_size 15M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Node.js API, including the scanned slips (/api/uploads/slips, sign-in required)
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React SPA (PWA) - everything else
    root  /usr/share/nginx/html;
    index index.html;

    # No $uri/ here: /assets is also the name of the folder of built files, and a directory match
    # would redirect a refresh on the Assets page to that folder instead of the app
    location / {
        try_files $uri /index.html;
    }

    # Vite puts a content hash in these file names, so they can be cached for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the page, the service worker or the app manifest,
    # or installed apps would keep running the old version after an update
    location = /index.html {
        expires -1;
    }
    location = /sw.js {
        expires -1;
    }
    location = /manifest.json {
        expires -1;
    }
}
