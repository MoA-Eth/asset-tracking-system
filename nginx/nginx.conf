# ==============================================================================
# LOCAL DEVELOPMENT CONFIGURATION (HTTP ONLY)
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # SSL configuration is disabled for local testing.
    # To enable for production, uncomment the lines below and restore the HTTPS block.

    # Scanned slips are at most 10 MB (backend/src/lib/uploads.ts), plus room for the request
    client_max_body_size 15M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Node.js API, including the scanned slips (/api/uploads/slips, sign-in required)
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # React SPA (PWA) - everything else
    root  /usr/share/nginx/html;
    index index.html;

    # No $uri/ here: /assets is also the name of the folder of built files, and a directory match
    # would redirect a refresh on the Assets page to that folder instead of the app
    location / {
        try_files $uri /index.html;
    }

    # Vite puts a content hash in these file names, so they can be cached for a year
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Never cache the page, the service worker or the app manifest,
    # or installed apps would keep running the old version after an update
    location = /index.html {
        expires -1;
    }
    location = /sw.js {
        expires -1;
    }
    location = /manifest.json {
        expires -1;
    }
}

# ==============================================================================
# PRODUCTION CONFIGURATION (HTTPS) - KEEP THIS FOR LATER
# ==============================================================================
# When you deploy to your actual server (ams.moa.gov.et), replace the block above 
# with your original HTTPS configuration and ensure the SSL certificates are mounted.